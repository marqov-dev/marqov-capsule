name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with dev extras
        run: pip install -e ".[dev]"

      - name: Validate JSON Schema is valid JSON
        run: |
          python -c "import json; json.load(open('spec/v1/capsule-schema.json')); print('schema OK')"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Validate conformance fixtures against schema
        run: |
          python - <<'EOF'
          import yaml, json
          from pathlib import Path
          import jsonschema
          schema = json.load(open("spec/v1/capsule-schema.json"))
          from marqov_capsule._canonical import load_manifest_yaml
          validator = jsonschema.Draft202012Validator(schema)
          valid = ["valid_capsule", "multi_task_capsule"]
          invalid = ["invalid_capsule"]
          for name in valid:
              cap = load_manifest_yaml(open(f"spec/v1/conformance/{name}/capsule.yaml").read())
              errors = list(validator.iter_errors(cap))
              assert errors == [], f"{name} should be valid but has errors: {errors}"
              print(f"  {name}: PASS")
          for name in invalid:
              cap = load_manifest_yaml(open(f"spec/v1/conformance/{name}/capsule.yaml").read())
              errors = list(validator.iter_errors(cap))
              assert errors, f"{name} should be invalid but passed"
              print(f"  {name}: correctly invalid ({len(errors)} errors)")
          EOF

      - name: CLI smoke test
        run: |
          marqov-capsule --version
          marqov-capsule validate spec/v1/conformance/valid_capsule/capsule.yaml
          marqov-capsule inspect spec/v1/conformance/valid_capsule
          marqov-capsule verify spec/v1/conformance/valid_capsule

  # Verify the built wheel (not editable install) ships the bundled schema
  # and that the package is importable from a wheel install.
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install from wheel (not editable)
        run: pip install dist/*.whl

      - name: Verify bundled schema ships in wheel and is byte-identical to spec/
        run: |
          python - <<'EOF'
          import importlib.resources as pkg
          import json, pathlib
          ref = pkg.files("marqov_capsule.schemas").joinpath("capsule-schema.json")
          wheel_bytes = ref.read_bytes()
          spec_bytes = pathlib.Path("spec/v1/capsule-schema.json").read_bytes()
          assert wheel_bytes == spec_bytes, "Bundled schema in wheel differs from spec/v1/capsule-schema.json — update the copy in marqov_capsule/schemas/"
          print("Bundled schema: byte-identical to spec copy")
          EOF

      - name: Verify CapsuleValidator works from wheel (no editable install path leakage)
        run: |
          python -c "
          from marqov_capsule import CapsuleValidator
          r = CapsuleValidator.validate({'version': '1.0.0', 'name': 'test', 'lifecycle_state': 'draft'})
          assert r['valid'] is True, r
          print('CapsuleValidator: OK from wheel install')
          "

  # Verify base install (no [dev] extra) doesn't hard-import numpy/scipy at import time
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base only (no [dev] extra)
        run: pip install -e .

      - name: Verify numpy is NOT importable (confirms lazy import)
        run: |
          python -c "
          import sys
          import marqov_capsule
          assert 'numpy' not in sys.modules, 'numpy was imported at package load time — check verifier.py lazy import guard'
          print('Lazy numpy import: OK')
          "

  # Single required status check. Once the ruleset requires only "CI Success",
  # the required context stays stable when the matrix changes — no need to pin
  # each `test (3.x)` individually.
  #
  # INVARIANT: every job in this workflow must appear in `needs:` below. A job
  # that's missing here can fail while CI Success stays green and the ruleset
  # stays satisfied — its failures become invisible. Add new jobs to `needs:` in
  # the same PR that introduces them. Nothing enforces this automatically.
  #
  # `if: always()` runs this even when an upstream job fails; the step then fails
  # unless EVERY needed result is 'success'. A naive `success()` gate would go
  # GREEN when an upstream job was skipped — reintroducing the hole this closes.
  ci-success:
    name: CI Success
    if: always()
    needs: [test, wheel-smoke, base-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 'skipped' counts as failure here because every job above always runs. If
      # a conditional job is added later (e.g. a path-filter that skips docs-only
      # PRs), this guard would fail every PR where that job legitimately skips —
      # revisit the 'skipped' clause then.
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job did not succeed — results: ${{ join(needs.*.result, ', ') }}"
          exit 1
