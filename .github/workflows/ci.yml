name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  schedule:
    # Weekly, not per-PR: tools/check_urls.py hits live external hosts, and
    # gating every PR on third-party uptime would make CI flaky for reasons
    # unrelated to the change under review. See the check-urls job below.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

# Cancel superseded in-progress runs on a PR branch when new commits land,
# but NEVER on main — a post-merge run on the default branch should always
# finish (that's what the github.ref exclusion guards).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: pip install -e ".[dev]"

      - name: Validate JSON Schema is valid JSON
        run: |
          python -c "import json; json.load(open('spec/v1/capsule-schema.json')); print('schema OK')"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Validate conformance fixtures against schema
        run: |
          python - <<'EOF'
          import yaml, json
          from pathlib import Path
          import jsonschema
          schema = json.load(open("spec/v1/capsule-schema.json"))
          from marqov_capsule._canonical import load_manifest_yaml
          validator = jsonschema.Draft202012Validator(schema)
          valid = ["valid_capsule", "multi_task_capsule"]
          invalid = ["invalid_capsule"]
          for name in valid:
              cap = load_manifest_yaml(open(f"spec/v1/conformance/{name}/capsule.yaml").read())
              errors = list(validator.iter_errors(cap))
              assert errors == [], f"{name} should be valid but has errors: {errors}"
              print(f"  {name}: PASS")
          for name in invalid:
              cap = load_manifest_yaml(open(f"spec/v1/conformance/{name}/capsule.yaml").read())
              errors = list(validator.iter_errors(cap))
              assert errors, f"{name} should be invalid but passed"
              print(f"  {name}: correctly invalid ({len(errors)} errors)")
          EOF

      - name: CLI smoke test
        run: |
          marqov-capsule --version
          marqov-capsule validate spec/v1/conformance/valid_capsule/capsule.yaml
          marqov-capsule inspect spec/v1/conformance/valid_capsule
          marqov-capsule verify spec/v1/conformance/valid_capsule

  # Verify the built wheel (not editable install) ships the bundled schema
  # and that the package is importable from a wheel install.
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install from wheel (not editable)
        run: pip install dist/*.whl

      - name: Verify bundled schema ships in wheel and is byte-identical to spec/
        run: |
          python - <<'EOF'
          import importlib.resources as pkg
          import json, pathlib
          ref = pkg.files("marqov_capsule.schemas").joinpath("capsule-schema.json")
          wheel_bytes = ref.read_bytes()
          spec_bytes = pathlib.Path("spec/v1/capsule-schema.json").read_bytes()
          assert wheel_bytes == spec_bytes, "Bundled schema in wheel differs from spec/v1/capsule-schema.json — update the copy in marqov_capsule/schemas/"
          print("Bundled schema: byte-identical to spec copy")
          EOF

      - name: Verify CapsuleValidator works from wheel (no editable install path leakage)
        run: |
          python -c "
          from marqov_capsule import CapsuleValidator
          r = CapsuleValidator.validate({'version': '1.0.0', 'name': 'test', 'lifecycle_state': 'draft'})
          assert r['valid'] is True, r
          print('CapsuleValidator: OK from wheel install')
          "

  # Verify base install (no [dev] extra) doesn't hard-import numpy/scipy at import time
  base-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install base only (no [dev] extra)
        run: pip install -e .

      - name: Verify numpy is NOT importable (confirms lazy import)
        run: |
          python -c "
          import sys
          import marqov_capsule
          assert 'numpy' not in sys.modules, 'numpy was imported at package load time — check verifier.py lazy import guard'
          print('Lazy numpy import: OK')
          "

      # Run the suite on a base install too. Tests needing the [verify] extra must
      # SKIP here, not fail — without this, a test that hard-requires numpy passes
      # CI (where [dev] is installed) while breaking every `pip install marqov-capsule`
      # user who runs it. pytest is installed on its own; it does not pull numpy.
      - name: Run tests on base install (numpy-dependent tests must skip)
        run: |
          pip install pytest
          python -m pytest tests/ -q

  # Prove the lower bounds declared in pyproject.toml are real. Every other job
  # resolves to the NEWEST compatible release, so a floor like `jsonschema>=4.0`
  # is an untested assertion — nothing installs that version until a user with
  # older pins does, and then the break is theirs, not ours. Oldest supported
  # Python + oldest declared deps is the combination we actually promise.
  minimum-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (oldest supported)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install at the lowest declared direct versions
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Show resolved versions
        run: uv pip list --system

      - name: Run tests at dependency floors
        run: python -m pytest tests/ -q

  # Runs tools/check_urls.py so it's actually exercised instead of rotting
  # unnoticed (#62) — but only on a schedule / manual dispatch, never on
  # push or pull_request. It hits live external hosts (github.com, arxiv.org,
  # pypi.org, ...); making every PR's mergeability depend on those hosts'
  # uptime would be a worse trade than the dead link it catches. Deliberately
  # NOT in ci-success's `needs:` — see the note on ci-success below.
  check-urls:
    name: Check URLs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check URLs in tracked files
        run: python tools/check_urls.py

  # Single required status check. Once the ruleset requires only "CI Success",
  # the required context stays stable when the matrix changes — no need to pin
  # each `test (3.x)` individually.
  #
  # INVARIANT: every job in this workflow that runs on push/pull_request must
  # appear in `needs:` below. A job that's missing here can fail while CI
  # Success stays green and the ruleset stays satisfied — its failures become
  # invisible. Add new jobs to `needs:` in the same PR that introduces them.
  # Nothing enforces this automatically.
  #
  # EXCEPTION: check-urls is deliberately excluded. It only ever runs on
  # `schedule` / `workflow_dispatch` (never push/pull_request — see its `if:`),
  # so on every push/PR run it would be permanently 'skipped'. The `if: always()`
  # gate below treats 'skipped' as failure for anything in `needs:`, so adding
  # it here would fail every single push/PR, permanently, for a job that never
  # even attempted to run. That's the "conditional job" case the comment below
  # already flags as needing this clause revisited — check-urls is it.
  #
  # `if: always()` runs this even when an upstream job fails; the step then fails
  # unless EVERY needed result is 'success'. A naive `success()` gate would go
  # GREEN when an upstream job was skipped — reintroducing the hole this closes.
  ci-success:
    name: CI Success
    if: always()
    needs: [test, wheel-smoke, base-install, minimum-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 'skipped' counts as failure here because every job above always runs. If
      # a conditional job is added later (e.g. a path-filter that skips docs-only
      # PRs), this guard would fail every PR where that job legitimately skips —
      # revisit the 'skipped' clause then.
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job did not succeed — results: ${{ join(needs.*.result, ', ') }}"
          exit 1
