name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-base:
    name: "Test (pyyaml only)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install pytest
      - run: pytest -v

  test-verify:
    name: "Test (with numpy/scipy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[verify,dev]"
      - run: pytest -v

  test-validate:
    name: "Test (with jsonschema)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[validate,dev]"
      - run: pytest -v

  test-all:
    name: "Test (all extras)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v
