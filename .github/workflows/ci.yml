name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]

# Default token scope for every job in this workflow: read-only. No job here
# needs to write to the repo, comment on a PR, or touch packages (#91, #115).
permissions:
  contents: read

# Cancel superseded in-progress runs on a PR branch when new commits land,
# but NEVER on main — a post-merge run on the default branch should always
# finish. Tag releases and manual runs are never cancelled either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope:
    # Drafts allocate no runner. Marking ready emits ready_for_review below.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_code: ${{ steps.scope.outputs.run_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Classify documentation-only changes
        run: python3 .github/scripts/ci_scope.py
      - name: Check documentation URL syntax without dependencies
        if: steps.scope.outputs.run_code == 'false'
        run: python3 tools/check_urls.py --offline

  # Formatter, linter and type checker, pinned in the [dev] extra so this job,
  # pre-commit and a local run agree (CONTRIBUTING.md "Quality gates").
  lint:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: pip install -e ".[dev]"

      - name: ruff format --check
        run: ruff format --check src tests tools

      - name: ruff check
        run: ruff check src tests tools

      - name: mypy
        run: mypy src

  test:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS exercises a case-insensitive, NFD-normalising filesystem and
        # un-skips the Unicode collision test (#113, #115).
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so diff-cover can find the merge base with main on
          # the coverage leg below. The pack is small, so this is cheap.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: pip install -e ".[dev]"

      - name: Validate JSON Schema is valid JSON
        run: |
          python -c "import json; json.load(open('spec/v1/capsule-schema.json')); print('schema OK')"

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: python -m pytest tests/ -v --tb=short --cov --cov-report=xml

      # Cirq-style gate: only the lines a PR changes must be covered. There is
      # deliberately no repo-wide coverage floor (CONTRIBUTING.md "Quality gates").
      - name: Changed lines are covered (diff-cover)
        if: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          set +e
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=90 \
            --format markdown:diff-cover.md
          status=$?
          set -e
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: CLI smoke test
        run: |
          marqov-capsule --version
          marqov-capsule validate spec/v1/conformance/valid_capsule/capsule.yaml
          marqov-capsule inspect spec/v1/conformance/valid_capsule
          marqov-capsule verify spec/v1/conformance/valid_capsule

  # The package is classified "OS Independent"; this is the leg that checks it
  # on Windows: '\\' path separators and CRLF text mode (#113, #115).
  # PYTHONUTF8 is set because the test code itself reads and writes fixtures
  # with the default encoding in a few hundred places; the package's own
  # text I/O is held to explicit encodings by tests/test_os_independence.py
  # on every OS (#103).
  test-windows:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q --tb=line -p no:cacheprovider

  # Verify the built wheel (not editable install) ships the bundled schema
  # and that the package is importable from a wheel install.
  wheel-smoke:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Check distribution contents
        run: python tools/check_distribution.py dist

      - name: Install from wheel (not editable)
        run: pip install dist/*.whl

      - name: Run isolated distribution acceptance
        run: python -I tools/smoke_distribution.py

      - name: Verify bundled schema ships in wheel and is byte-identical to spec/
        run: |
          python - <<'EOF'
          import importlib.resources as pkg
          import json, pathlib
          ref = pkg.files("marqov_capsule.schemas").joinpath("capsule-schema.json")
          wheel_bytes = ref.read_bytes()
          spec_bytes = pathlib.Path("spec/v1/capsule-schema.json").read_bytes()
          assert wheel_bytes == spec_bytes, "Bundled schema in wheel differs from spec/v1/capsule-schema.json — update the copy in marqov_capsule/schemas/"
          print("Bundled schema: byte-identical to spec copy")
          EOF

      - name: Verify CapsuleValidator works from wheel (no editable install path leakage)
        run: |
          python -c "
          from marqov_capsule import CapsuleValidator
          r = CapsuleValidator.validate({'version': '1.0.0', 'name': 'test', 'lifecycle_state': 'draft'})
          assert r['valid'] is True, r
          print('CapsuleValidator: OK from wheel install')
          "

  # Verify base install (no [dev] extra) doesn't hard-import numpy/scipy at import time
  base-install:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install base only (no [dev] extra)
        run: pip install -e .

      - name: Verify numpy is NOT importable (confirms lazy import)
        run: |
          python -c "
          import sys
          import marqov_capsule
          assert 'numpy' not in sys.modules, 'numpy was imported at package load time — check verifier.py lazy import guard'
          print('Lazy numpy import: OK')
          "

      # Run the suite on a base install too. Tests needing the [verify] extra must
      # SKIP here, not fail — without this, a test that hard-requires numpy passes
      # CI (where [dev] is installed) while breaking every `pip install marqov-capsule`
      # user who runs it. pytest is installed on its own; it does not pull numpy.
      - name: Run tests on base install (numpy-dependent tests must skip)
        run: |
          pip install pytest
          python -m pytest tests/ -q -rs
      # A module-level importorskip silently removes a whole file from
      # collection on this job (#39, #116). tests/test_suite_hygiene.py fails
      # on that pattern; this step shows the collected count so a drop is
      # visible in the log as well.
      - name: Show collected test count on base install
        run: python -m pytest tests/ --collect-only -q | tail -1

  # Prove the lower bounds declared in pyproject.toml are real. Every other job
  # resolves to the NEWEST compatible release, so a floor like `jsonschema>=4.0`
  # is an untested assertion — nothing installs that version until a user with
  # older pins does, and then the break is theirs, not ours. Oldest supported
  # Python + oldest declared deps is the combination we actually promise.
  minimum-versions:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python (oldest supported)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install at the lowest declared direct versions
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Show resolved versions
        run: uv pip list --system

      - name: Run tests at dependency floors
        run: python -m pytest tests/ -q

  conformance-node:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/conformance/package-lock.json
      - name: Install pinned independent parser
        run: npm ci --prefix tools/conformance --ignore-scripts
      - name: Check corpus with independent YAML and canonicalization
        run: npm test --prefix tools/conformance

  links:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check URL syntax and reviewed Marqov hosts
        run: python tools/check_urls.py --offline

  # Single required status check. Once the ruleset requires only "CI Success",
  # the required context stays stable when the matrix changes — no need to pin
  # each `test (3.x)` individually.
  #
  # INVARIANT: every job in this workflow must appear in `needs:` below. A job
  # that's missing here can fail while CI Success stays green and the ruleset
  # stays satisfied — its failures become invisible. Add new jobs to `needs:` in
  # the same PR that introduces them. Nothing enforces this automatically.
  #
  # Always evaluate non-draft results: require code jobs to succeed, or to
  # skip deliberately after a successful documentation-only scope decision.
  # Planner failures and unexpected skips must never satisfy this gate.
  ci-success:
    name: CI Success
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    needs: [ci-scope, lint, test, test-windows, wheel-smoke, base-install, minimum-versions, links, conformance-node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful code checks or deliberate documentation skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          scope = needs.pop("ci-scope")
          if scope["result"] != "success":
              raise SystemExit("Scope planner did not succeed")
          run_code = scope["outputs"].get("run_code")
          if run_code not in {"true", "false"}:
              raise SystemExit("Scope planner returned no valid decision")
          expected = "success" if run_code == "true" else "skipped"
          unexpected = {name: job["result"] for name, job in needs.items() if job["result"] != expected}
          if unexpected:
              raise SystemExit(f"Required jobs must be {expected}: {unexpected}")
          PY_GATE
