name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual TestPyPI dry-run
permissions:
  contents: read
jobs:
  # A `v*` tag push previously reached `publish-pypi` on `build` alone, which
  # never runs the test suite — a red CI run on the tagged commit did not stop
  # a release. This job is release.yml's own gate, independent of ci.yml, so
  # publishing is never one push away from shipping untested code (#91, #115).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install uv && uv build
      - name: Assert built version matches the tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -f "dist/marqov_capsule-${TAG}-py3-none-any.whl" \
            || { echo "FAIL: built wheel is not version ${TAG} (check pyproject version)"; ls dist/; exit 1; }
          echo "version OK: ${TAG}"
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Check distribution contents
        run: python tools/check_distribution.py dist
      - name: Exercise the built wheel in a clean base environment
        run: |
          uv venv /tmp/capsule-release-acceptance
          uv pip install --python /tmp/capsule-release-acceptance/bin/python dist/*.whl
          /tmp/capsule-release-acceptance/bin/python -I tools/smoke_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: dist, path: dist/ }

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
