name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual TestPyPI dry-run
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv && uv build
      - name: Assert built version matches the tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -f "dist/marqov_capsule-${TAG}-py3-none-any.whl" \
            || { echo "FAIL: built wheel is not version ${TAG} (check pyproject version)"; ls dist/; exit 1; }
          echo "version OK: ${TAG}"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # This dry-run publishes the real target version (X.Y.Z from
          # pyproject.toml on the release branch), and TestPyPI won't let a
          # version's files be re-uploaded any more than real PyPI will.
          # skip-existing makes re-running this job against an *unchanged*
          # build a no-op instead of a hard failure — see RELEASING.md.
          skip-existing: true

  publish-pypi:
    needs: build
    # event_name, not just ref, is the gate: a workflow_dispatch run against
    # a tag ref still has github.ref == refs/tags/vX.Y.Z, so gating on ref
    # alone would let a manual dispatch double-fire this job alongside
    # publish-testpypi and publish to real PyPI. Only an actual tag *push*
    # may publish here; workflow_dispatch can never reach real PyPI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
