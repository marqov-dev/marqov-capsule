# Keeps the SHA-pinned actions in .github/workflows current (#115).
# Monthly and grouped into one PR to keep CI minutes down. Python dependencies
# are deliberately not managed here: pyproject.toml declares floors, which the
# minimum-versions job tests, not pins to bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # tools/reproduction/evidence/ is a frozen, hash-pinned record of a past run
  # (its SHA256SUMS covers requirements.txt). Bumping a pin there would falsify
  # the record, so no version or security update PRs for it. Its alerts are
  # dismissed as evidence-only; the package itself does not depend on it.
  - package-ecosystem: pip
    directory: /tools/reproduction/evidence/2026-11-14-bell-pilot
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
