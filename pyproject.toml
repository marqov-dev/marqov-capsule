[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marqov-capsule"
version = "0.1.0"
description = "Open standard and tooling for reproducible, portable quantum experiments"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "click>=8.0",
    "jcs>=0.2",
]

[project.optional-dependencies]
verify = [
    "numpy>=1.24",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
marqov-capsule = "marqov_capsule.cli.main:cli"

[project.urls]
Homepage = "https://github.com/marqov-dev/marqov-capsule"
Repository = "https://github.com/marqov-dev/marqov-capsule"

[tool.hatch.build.targets.wheel]
packages = ["src/marqov_capsule"]
artifacts = ["src/marqov_capsule/schemas/*"]

[tool.hatch.build.targets.sdist]
include = [
    "src/marqov_capsule/",
    "spec/",
    "LICENSE-CODE",
    "LICENSE-SPEC",
    "README.md",
]
