[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marqov-capsule"
version = "0.1.0"
description = "Open standard and tooling for reproducible, portable quantum experiments"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    {name = "Marqov", email = "hello@marqov.ai"},
]
keywords = ["quantum", "reproducibility", "capsule", "qpu", "workflow", "quantum-computing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "click>=8.0",
    "jcs>=0.2",
]

[project.optional-dependencies]
verify = [
    "numpy>=1.24",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
marqov-capsule = "marqov_capsule.cli.main:cli"

[project.urls]
Homepage = "https://github.com/marqov-dev/marqov-capsule"
Repository = "https://github.com/marqov-dev/marqov-capsule"
Issues = "https://github.com/marqov-dev/marqov-capsule/issues"
Changelog = "https://github.com/marqov-dev/marqov-capsule/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/marqov_capsule"]
artifacts = ["src/marqov_capsule/schemas/*"]

[tool.hatch.build.targets.sdist]
include = [
    "src/marqov_capsule/",
    "spec/",
    "LICENSE-CODE",
    "LICENSE-SPEC",
    "README.md",
]
