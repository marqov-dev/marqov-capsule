[project]
name = "marqov-capsule"
version = "1.0.0"
description = "Standalone capsule format for reproducible quantum-classical workflows"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
verify = ["numpy", "scipy"]
validate = ["jsonschema>=4.0"]
dev = ["pytest>=7.0", "numpy", "scipy", "jsonschema>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marqov_capsule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
